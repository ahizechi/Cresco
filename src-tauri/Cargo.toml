[package]
name = "cresco-desktop"
version = "0.1.4"
license = "MIT"
description = "Local habits and personal finance"
edition = "2021"
rust-version = "1.88"
publish = false
[lib]
name = "cresco_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }
[dependencies]
tauri = { version = "=2.12.1", features = [] }
tauri-plugin-dialog = "=2.7.3"
tauri-plugin-single-instance = "=2.4.4"
tauri-plugin-updater = "=2.13.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
chrono = { version = "=0.4.45", default-features = false, features = ["std", "clock"] }
chrono-tz = "=0.10.4"
uuid = { version = "=1.26.1", features = ["v4"] }
sha2 = "=0.10.9"
time = { version = "=0.3.55", features = ["formatting", "parsing"] }
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
